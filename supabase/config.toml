# Minimal Supabase config for Edge Functions.
# Deploy: supabase functions deploy send-rsvp-email send-event-reminders
# Secrets: supabase secrets set RESEND_API_KEY=... EMAIL_HOOK_SECRET=... EVENT_EMAIL_FROM="TESC Portal <events@tescatucsd.org>" APP_URL=https://portal.tescatucsd.org

project_id = "mxbwjmjpevvyejnugisy"

[auth]
site_url = "https://portal.tescatucsd.org"
additional_redirect_urls = [
  "https://portal.tescatucsd.org",
  "https://portal.tescatucsd.org/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/**",
]

[functions.send-rsvp-email]
verify_jwt = false

[functions.send-event-reminders]
verify_jwt = false
